<!DOCTYPE html>
<html lang="en" class="nsg-scrollbar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="NSG UI — a SolidJS component library with accessible, themeable components including buttons, dialogs, menus, inputs, and more." />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- The latin cut of Outfit paints the LCP text, so warm it from HTML-parse
         time rather than waiting for the app CSS to be parsed and applied. -->
    <link rel="preload" href="https://fonts.gstatic.com/s/outfit/v15/QGYvz_MVcBeNP4NJtEtq.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@nxtcoder17/nxtfont@1.0.2/WOFF2/NxtFont-Regular.latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@nxtcoder17/nxtfont@1.0.2/WOFF2/NxtFont-Medium.latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Not So Good UI - NSG UI</title>
    <script>
      // Restore colour scheme + theme foundation before the first paint, so the
      // page never flashes the default design.
      try {
        const scheme = localStorage.getItem("nsg-ui-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (scheme === "dark" || (scheme !== "light" && prefersDark)) {
          document.documentElement.classList.add("dark");
        }

        // Two kinds of stale id: one foundation was renamed (`modern-brut-violet`
        // -> `modern-brut`), and the two riso plates were retired outright and
        // fall back to `default`. Both have to be remapped here, or the pre-paint
        // script would reinstate an id no stylesheet answers to.
        const RENAMED = {
          "modern-brut-violet": "modern-brut",
          "riso-aqua": "default",
          "riso-press": "default",
        };
        const stored = localStorage.getItem("nsg-ui-foundation");
        const foundation = stored ? (RENAMED[stored] ?? stored) : null;
        if (foundation && foundation !== "default") {
          document.documentElement.dataset.nsgTheme = foundation;
        }
      } catch {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
